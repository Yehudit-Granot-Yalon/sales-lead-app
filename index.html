<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איסוף לידים - מכירות שטח</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit { background-color: #28a745; color: white; }
    .btn-export { background-color: #007bff; color: white; }
    .btn-clear { background-color: #dc3545; color: white; opacity: 0.7; font-size: 14px; margin-top: 25px; }
    .error-msg { color: #dc3545; font-size: 14px; display: none; margin-top: 5px; }
    .success-msg { color: #28a745; text-align: center; font-weight: bold; display: none; margin-top: 10px; }
    .counter { text-align: center; font-size: 14px; color: #666; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>טופס הרשמה למכירה</h2>

  <form id="leadForm">
    <div class="form-group">
      <label for="cityInput">עיר:</label>
      <input list="citiesList" id="cityInput" placeholder="בחר או הקלד עיר..." required>
      <datalist id="citiesList">
        <option value="אלעד">
        <option value="בני ברק">
        <option value="ירושלים">
        <option value="בית שמש">
      </datalist>
    </div>

    <div class="form-group">
      <label for="phone">טלפון:</label>
      <input type="tel" id="phone" placeholder="05X-XXXXXXX">
    </div>

    <div class="form-group">
      <label for="email">אימייל:</label>
      <input type="email" id="email" placeholder="example@mail.com">
    </div>

    <div id="contactError" class="error-msg">יש למלא לפחות טלפון אחד או כתובת מייל!</div>
    <div id="successMsg" class="success-msg">הנתונים נשמרו בהצלחה!</div>

    <button type="submit" class="btn-submit">שמור נתונים</button>
  </form>

  <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

  <button id="exportBtn" class="btn-export">📥 ייצא לקובץ Excel (CSV)</button>
  <div id="leadCount" class="counter">סה"כ נרשמו עד כה: 0</div>

  <button id="clearBtn" class="btn-clear">מחק את כל הנתונים מהמכשיר</button>
</div>

<script>
  // מפתחות ב-LocalStorage
  const STORAGE_KEY = 'sales_leads_data';
  const CITIES_KEY = 'sales_cities_list';

  // טעינת רשימת ערים שמורה או ברירת מחדל
  function loadCities() {
    const savedCities = JSON.parse(localStorage.getItem(CITIES_KEY)) || ["אלעד", "בני ברק", "ירושלים", "בית שמש"];
    const datalist = document.getElementById('citiesList');
    datalist.innerHTML = '';
    savedCities.forEach(city => {
      const option = document.createElement('option');
      option.value = city;
      datalist.appendChild(option);
    });
  }

  // הוספת עיר חדשה לרשימה הנגללת במידה ולא הייתה קיימת
  function saveNewCity(city) {
    let savedCities = JSON.parse(localStorage.getItem(CITIES_KEY)) || ["אלעד", "בני ברק", "ירושלים", "בית שמש"];
    if (!savedCities.includes(city)) {
      savedCities.push(city);
      localStorage.setItem(CITIES_KEY, JSON.stringify(savedCities));
      loadCities();
    }
  }

  // עדכון מונה הלידים במסך
  function updateCounter() {
    const leads = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    document.getElementById('leadCount').innerText = `סה"כ נרשמו עד כה: ${leads.length}`;
  }

  // שמירת הטופס
  document.getElementById('leadForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const city = document.getElementById('cityInput').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const errorMsg = document.getElementById('contactError');
    const successMsg = document.getElementById('successMsg');

    // אימות: חובה לפחות טלפון או מייל
    if (!phone && !email) {
      errorMsg.style.display = 'block';
      return;
    }
    errorMsg.style.display = 'none';

    // שמירת העיר לרשימה הנגללת העתידית
    saveNewCity(city);

    // יצירת אובייקט הליד
    const newLead = {
      city: city,
      phone: phone,
      email: email,
      date: new Date().toLocaleString('he-IL')
    };

    // שמירה ב-LocalStorage
    const leads = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    leads.push(newLead);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));

    // איפוס הטופס והצגת הודעת הצלחה
    document.getElementById('phone').value = '';
    document.getElementById('email').value = '';
    successMsg.style.display = 'block';
    setTimeout(() => { successMsg.style.display = 'none'; }, 2000);

    updateCounter();
  });

  // ייצוא לקובץ אקסל (CSV עם תמיכה מלאה בעברית)
  document.getElementById('exportBtn').addEventListener('click', function() {
    const leads = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    if (leads.length === 0) {
      alert('אין נתונים לייצוא עדיין.');
      return;
    }

    // הוספת UTF-8 BOM כדי שהאקסל יפתח את העברית כראוי
    let csvContent = "\uFEFF"; 
    csvContent += "עיר,טלפון,מייל,תאריך הרשמה\n";

    leads.forEach(row => {
      // עטיפה במירכאות למניעת שגיאות פסיקים
      const cityEscaped = `"${row.city.replace(/"/g, '""')}"`;
      const phoneEscaped = `"${row.phone.replace(/"/g, '""')}"`;
      const emailEscaped = `"${row.email.replace(/"/g, '""')}"`;
      const dateEscaped = `"${row.date}"`;

      csvContent += `${cityEscaped},${phoneEscaped},${emailEscaped},${dateEscaped}\n`;
    });

    // הורדת הקובץ
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `leads_export_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  // ניקוי זיכרון
  document.getElementById('clearBtn').addEventListener('click', function() {
    if (confirm('האם אתה בטוח שברצונך למחוק את כל הנתונים שנשמרו במכשיר זה?')) {
      localStorage.removeItem(STORAGE_KEY);
      updateCounter();
      alert('הנתונים נמחקו בהצלחה.');
    }
  });

  // טעינה ראשונית
  loadCities();
  updateCounter();
</script>

</body>
</html>
