<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה לעדכוני מכירה</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 24px 18px;
        direction: rtl;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .container {
        width: min(92vw, 620px);
        max-width: 620px;
        margin: 0 auto;
        background: #fff;
        padding: 34px 32px 28px;
        border-radius: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        position: relative;
        box-sizing: border-box;
      }
      h2 {
        text-align: center;
        color: #2c3e50;
        margin-top: 10px;
        font-size: 28px;
      }
      .subtitle {
        text-align: center;
        color: #7f8c8d;
        margin-bottom: 28px;
        font-size: 17px;
      }
      .form-group {
        margin-bottom: 22px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #34495e;
        font-size: 18px;
      }
      input, select {
        width: 100%;
        padding: 18px 16px;
        border: 1.5px solid #dcdde1;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 18px;
        min-height: 58px;
      }
      input:focus {
        border-color: #3498db;
        outline: none;
      }
      button {
        width: 100%;
        padding: 18px 16px;
        border: none;
        border-radius: 10px;
        font-size: 19px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 12px;
        min-height: 58px;
      }
      .btn-submit {
        background-color: #27ae60;
        color: white;
      }
      .btn-export {
        background-color: #2980b9;
        color: white;
        margin-top: 15px;
      }
      .btn-clear {
        background-color: #e74c3c;
        color: white;
        opacity: 0.8;
        font-size: 16px;
        margin-top: 15px;
      }
      .btn-user {
        background-color: #2c3e50;
        color: white;
      }
      .btn-admin {
        background-color: #8e44ad;
        color: white;
      }
      .switch-user {
        background-color: #95a5a6;
        color: #fff;
        margin-top: 15px;
      }
      .admin-toggle {
        position: absolute;
        top: 15px;
        left: 15px;
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        width: auto;
        padding: 0;
        margin: 0;
        display: none;
      }
      .hidden {
        display: none !important;
      }
      .auth-screen {
        width: min(92vw, 560px);
        max-width: 560px;
        margin: 80px auto;
        background: white;
        padding: 34px 28px;
        border-radius: 18px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.09);
        box-sizing: border-box;
      }
      .auth-screen h2 {
        margin-top: 0;
        font-size: 28px;
      }
      .auth-screen p {
        text-align: center;
        color: #7f8c8d;
        margin-bottom: 24px;
        font-size: 17px;
      }
      .error-msg {
        color: #e74c3c;
        font-size: 14px;
        display: none;
        margin-top: 5px;
        text-align: center;
        font-weight: bold;
      }
      .success-msg {
        color: #27ae60;
        text-align: center;
        font-weight: bold;
        display: none;
        margin-top: 15px;
        font-size: 18px;
        background: #eafaf1;
        padding: 10px;
        border-radius: 6px;
      }
      .city-badge {
        background-color: #e8f4fd;
        color: #2980b9;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: bold;
        display: inline-block;
        margin-top: 5px;
      }
      .admin-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 100;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .admin-box {
        background: white;
        padding: 25px;
        border-radius: 12px;
        width: min(92vw, 430px);
        max-width: 430px;
        box-sizing: border-box;
      }

      @media (max-width: 768px) {
        body {
          padding: 18px 14px;
        }

        .container,
        .auth-screen,
        .admin-box {
          width: min(92vw, 500px);
        }

        .container,
        .auth-screen {
          padding: 22px 18px;
        }

        h2 {
          font-size: 24px;
        }

        .subtitle,
        .auth-screen p {
          font-size: 15px;
        }

        label {
          font-size: 17px;
        }

        input, select {
          padding: 15px 14px;
          font-size: 17px;
        }

        button {
          font-size: 17px;
          padding: 15px 14px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 14px 12px;
        }

        .container,
        .auth-screen,
        .admin-box {
          width: 100%;
        }

        .container,
        .auth-screen {
          padding: 18px 14px;
        }

        .subtitle,
        .auth-screen p {
          font-size: 14px;
        }

        input, select, button {
          font-size: 15px;
        }

        .admin-toggle {
          font-size: 20px;
          top: 12px;
          left: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="authScreen" class="auth-screen">
      <h2>בחרו סוג משתמש</h2>
      <p>משתמש כללי אינו צריך סיסמה. מנהל נדרש להזין סיסמה.</p>
      <button type="button" id="continueUserBtn" class="btn-user">משתמש כללי</button>
      <button type="button" id="adminLoginBtn" class="btn-admin">התחברות כמנהל</button>
    </div>

    <div id="appContainer" class="hidden">
      <div class="container">
        <button class="admin-toggle" id="adminToggleBtn" onclick="openAdmin()" title="ניהול מכירה">⚙️</button>

        <div style="text-align: center;">
          <h2 id="displayTitle">הרשמה לעדכוני מכירה</h2>
          <div id="cityBadgeContainer" style="display: none;">
            <span class="city-badge" id="currentCityText"></span>
          </div>
          <p class="subtitle">השאירו פרטים וקבלו עדכון ראשונים על המכירה הבאה!</p>
        </div>

        <form id="leadForm">
          <div class="form-group">
            <label for="phone">מספר טלפון:</label>
            <input type="tel" id="phone" placeholder="05X-XXXXXXX" autocomplete="off" spellcheck="false">
          </div>

          <div class="form-group">
            <label for="email">כתובת אימייל:</label>
            <input type="email" id="email" placeholder="name@example.com" autocomplete="off" spellcheck="false">
          </div>

          <div class="form-group">
            <label for="citySelect">ערים לקבלת עדכונים:</label>
            <select id="citySelect" aria-label="בחר ערים" autocomplete="off" multiple size="6"></select>
          </div>

          <div id="contactError" class="error-msg">נא להזין לפחות טלפון או כתובת מייל!</div>
          <div id="noCityError" class="error-msg">שימי לב: טרם נבחרה עיר ע"י המנהלת!</div>

          <button type="submit" class="btn-submit">שמור פרטים</button>
          <div id="successMsg" class="success-msg">תודה! הפרטים נשמרו בהצלחה 🎉</div>
        </form>

        <button type="button" id="switchUserBtn" class="switch-user">החלף משתמש</button>
      </div>
    </div>

    <div id="adminModal" class="admin-modal">
      <div class="admin-box">
        <h3 style="margin-top:0; text-align:center;">הגדרות מנהלת ⚙️</h3>

        <div class="form-group">
          <label for="citySelectInput">עיר המכירה הנוכחית:</label>
          <input list="citiesList" id="citySelectInput" placeholder="בחר או הקלד עיר...">
          <datalist id="citiesList"></datalist>
        </div>

        <button type="button" class="btn-submit" onclick="saveEventCity()">החל עיר לאירוע זה</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <button type="button" id="exportBtn" class="btn-export">📥 ייצא לקובץ Excel (CSV)</button>
        <div id="leadCount" style="text-align:center; font-size:14px; margin-top:10px; color:#555;">סה"כ נרשמו: 0</div>

        <button type="button" id="clearBtn" class="btn-clear">מחק את כל המידע מהמכשיר</button>
        <button type="button" onclick="changeAdminPassword()" style="background:#6c757d; color:white; margin-top:10px;">🔑 שינוי סיסמת מנהלת</button>
        <button type="button" onclick="closeAdmin()" style="background:#bdc3c7; color:#333; margin-top:10px;">סגור</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
